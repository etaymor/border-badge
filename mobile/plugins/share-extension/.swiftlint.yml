# SwiftLint Configuration for Share Extension
#
# All complexity rules are enabled with appropriate thresholds.
# Run `swiftlint lint --strict` to enforce these as errors.

# Opt-in rules for better code quality
opt_in_rules:
  - empty_count
  - empty_string

# Configure line length
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

# Identifier naming - allow standard abbreviations
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - ok
    - db
    - to
    - x
    - y
    - i
    - j
    - q

# File length - accommodate view controllers and test files
file_length:
  warning: 700
  error: 800

# Type body length - accommodate complex view controllers
type_body_length:
  warning: 500
  error: 600

# Function body length - accommodate complex setup functions
function_body_length:
  warning: 80
  error: 120

# Cyclomatic complexity - allow reasonable branching
cyclomatic_complexity:
  warning: 15
  error: 25

# Exclude generated files and build artifacts
excluded:
  - Pods
  - .build
  - DerivedData
