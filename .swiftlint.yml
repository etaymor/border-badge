# SwiftLint configuration for iOS Share Extension
# https://github.com/realm/SwiftLint

disabled_rules:
  - line_length  # SwiftUI views can be long
  - trailing_whitespace
  - identifier_name  # Allow short names like `id`, `url`
  - multiple_closures_with_trailing_closure  # Common in SwiftUI
  - for_where  # Sometimes if inside for is clearer
  - cyclomatic_complexity  # SwiftUI views can be complex
  - function_body_length  # SwiftUI views can have long bodies
  - todo  # Allow TODO comments
  - implicit_optional_initialization  # Optional = nil is explicit
  - redundant_discardable_let  # let _ = is clearer than _ =

included:
  - mobile/plugins/share-extension

excluded:
  - Pods
  - mobile/ios/Pods
  - mobile/node_modules
  - mobile/plugins/share-extension/Tests  # Tests can use force unwrap

# Customizations
force_cast:
  severity: warning

force_try:
  severity: warning

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 400
  error: 600

nesting:
  type_level: 2
  function_level: 3
