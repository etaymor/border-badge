[tool.poetry]
name = "border-badge-backend"
version = "0.1.0"
description = "FastAPI backend for Border Badge travel tracking app"
authors = ["Border Badge Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
httpx = "^0.28.0"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.6.0"
pyjwt = "^2.9.0"
slowapi = "^0.1.9"
jinja2 = "^3.1.0"
mistune = "^3.1"
pyyaml = "^6.0.2"
pillow = "^11.0.0"
pillow-heif = "^0.21.0"
email-validator = "^2.3.0"
rapidfuzz = "^3.6"
resend = "^2.0.0"
python-multipart = "^0.0.21"
tenacity = "^9.1.2"
yt-dlp = "^2025.1.15"
gallery-dl = "^1.31.0"
instaloader = "^4.13"
curl-cffi = "^0.13.0,<0.14.0"
posthog = ">=3.7"
facebook-business = "^24.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
rcssmin = "^1.2.2"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.0"
pytest-cov = "^7.0.0"
# Driver for the real-Postgres SQL test suite (tests/sql, marker: sql).
# Tests importorskip it, so environments without it still run green.
psycopg = {extras = ["binary"], version = "^3.2"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "B008",   # function call in argument defaults (FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "sql: SQL-layer tests that require SUPABASE_DB_URL pointing at a migrated database",
]
