name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a senior engineer doing a quick, high-signal review of this pull request.

            Your goals:
            - Find correctness bugs, logic errors, and missing edge cases.
            - Find security issues (auth, access control, injections, unsafe deserialization, secret leakage, insecure randomness, etc.).
            - Flag obvious performance problems that could matter in production (N+1 queries, unnecessary O(n^2) work, blocking calls in hot paths).

            Constraints:
            - Ignore code style, formatting, and naming unless it directly hides a bug or vulnerability.
            - Do not request large refactors or architectural changes.
            - Prefer a single structured review comment over many nitpicky line comments.

            Output format:
            - Summary: 1–3 bullet points.
            - Issues: bullet list grouped by [Bug], [Security], or [Performance], each with:
              - What the issue is.
              - Why it matters.
              - A concrete, minimal fix suggestion.
            - If there are no meaningful issues, say: "No significant bugs, security issues, or performance problems found."

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/sdk#command-line for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
